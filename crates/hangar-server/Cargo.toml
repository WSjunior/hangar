[package]
name = "hangar-server"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# float_roundtrip: o float lido sai com o mesmo valor que o float() do Python, e o repr bate.
serde_json = { workspace = true, features = ["float_roundtrip"] }
indexmap.workspace = true
hangar-api.workspace = true
hangar-workspace = { path = "../hangar-workspace" }
regex.workspace = true
# Busca de trecho no rabo do transcript; já vem pelo regex.
memchr = "=2.8.3"
md-5.workspace = true
sha1_smol.workspace = true
# sha256 do workdir_key do Kimi; já vem pelo rustls, sem crate novo.
ring = "=0.17.14"
serde.workspace = true
axum = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
subtle = { workspace = true }
# io-std: o stdin é o cano que avisa a morte do Python.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
mime_guess = "=2.0.5"
base64 = "=0.23.1"
rusqlite.workspace = true
rayon.workspace = true
reqwest = { workspace = true, features = ["rustls"] }

# Processos fora do Linux; no Linux o leitor é o /proc (`list/procs.rs`).
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true

# O leitor `sysinfo` (`list/procs.rs`) também é testado no Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
